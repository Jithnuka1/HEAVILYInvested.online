<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Go Listen TWIN | Heavily Invested</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .music-page {
      width: min(1200px, 90%);
      margin: 0 auto;
      padding: 70px 0;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 50px;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    .album {
      text-decoration: none;
      color: #ffffff;
      display: block;
    }

    .album img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .album:hover img {
      transform: scale(1.03);
    }

    .album-title {
      font-size: 18px;
      font-weight: bold;
      margin: 14px 0 5px;
    }

    .artist {
      font-size: 15px;
      color: #aaaaaa;
      margin: 0;
    }

    @media (max-width: 800px) {
      .album-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      .album-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>


<body>

  <main class="music-page">

    <h1>Go Listen TWIN</h1>

    <div class="album-grid">


      <!-- ALBUM 1 -->
      <a
        class="album"
        href="https://open.spotify.com/album/4HTVABUq8amDUxBv3zJbX4?highlight=spotify:track:7rt0kEDWRg3pgTZJKuszoE"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="/images/album1.png" alt="Album 1">

        <p class="album-title">Brown Sugar</p>
        <p class="artist">D'Angelo</p>
      </a>


      <!-- ALBUM 2 -->
      <a
        class="album"
        href="https://open.spotify.com/album/3T4tUhGYeRNVUGevb0wThu"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="/images/album2.png" alt="Album 2">

        <p class="album-title">Divide</p>
        <p class="artist">Ed Sheeran</p>
      </a>


      <!-- ALBUM 3 -->
      <a
        class="album"
        href="https://open.spotify.com/album/20r762YmB5HeofjMCiPMLv"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="/images/album3.png" alt="Album 3">

        <p class="album-title">My Beautiful Dark Twisted Fantasy</p>
        <p class="artist">KanYe West</p>
      </a>


      <!-- ALBUM 4 -->
      <a
        class="album"
        href="https://open.spotify.com/album/5mz0mJxb80gqJIcRf9LGHJ"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img src="/images/album4.png" alt="Album 4">

        <p class="album-title">Nothing Was The Same</p>
        <p class="artist">Drake</p>
      </a>


    </div>

  </main>

</body>
</html>
